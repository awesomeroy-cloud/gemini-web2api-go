<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>try{document.querySelector('meta[name="color-scheme"]').content=localStorage.getItem("color-scheme")??"light dark";}catch(_){}</script>
  <title>GEMINI GATEWAY · Control Plane</title>
  <link rel="stylesheet" href="styles.css">
  <script src="chart.umd.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <button type="button" id="btnMobileMenu" class="btn mobile-menu-btn" aria-expanded="false" aria-controls="sidebarNav" data-i18n-aria="header.menu_toggle">☰</button>
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">G</div>
        <div class="brand__text">
          <span class="brand__title" data-i18n="brand.title">GEMINI GATEWAY</span>
          <span class="brand__sub" data-i18n="brand.sub">CONTROL PLANE</span>
        </div>
      </div>
      <div id="headerHealthChip" class="status-chip" aria-live="polite">
        <span id="headerHealthDot" class="status-dot" aria-hidden="true"></span>
        <span id="headerHealthText">--</span>
      </div>
    </div>

    <search class="topbar__search">
      <form id="quickSearchForm">
        <label class="sr-only" for="quickAuditSearch" data-i18n="header.search_placeholder">按审计关键词/模型/Trace ID 快速跳转…</label>
        <input type="search" id="quickAuditSearch" name="q" data-i18n-placeholder="header.search_placeholder">
        <button type="submit" class="btn btn--sm">Go</button>
      </form>
    </search>

    <div class="topbar__actions">
      <button type="button" id="btnQuickProbe" class="btn btn--sm" data-i18n="header.probe_btn">快速探针</button>
      <button type="button" id="btnGlobalRefresh" class="btn btn--sm" data-i18n="header.refresh_btn">刷新</button>
      <button type="button" id="btnThemeToggle" class="btn btn--sm" data-i18n-aria="header.theme_toggle" aria-pressed="false">Theme</button>
      <button type="button" id="btnLangToggle" class="btn btn--sm" data-i18n="header.lang_toggle">中 / EN</button>
      <button type="button" id="btnLogout" class="btn btn--sm btn--danger" data-i18n="header.logout" hidden>退出登录</button>
    </div>
  </header>

  <div class="shell">
    <nav id="sidebarNav" class="sidebar" aria-label="Main navigation">
      <ul class="nav-list">
        <li>
          <button type="button" class="nav-btn" data-view="overview" aria-current="page">
            <span data-i18n="nav.overview">指挥总览</span>
          </button>
        </li>
        <li>
          <button type="button" class="nav-btn" data-view="traffic">
            <span data-i18n="nav.traffic">流量与审计</span>
          </button>
        </li>
        <li>
          <button type="button" class="nav-btn" data-view="accounts">
            <span data-i18n="nav.accounts">账号池与视频配额</span>
            <span id="navBadgeAccounts" class="nav-btn__badge">-</span>
          </button>
        </li>
        <li>
          <button type="button" class="nav-btn" data-view="egress">
            <span data-i18n="nav.egress">出口代理与限流</span>
            <span id="navBadgeProxies" class="nav-btn__badge">-</span>
          </button>
        </li>
        <li>
          <button type="button" class="nav-btn" data-view="models">
            <span data-i18n="nav.models">模型注册表</span>
          </button>
        </li>
        <li>
          <button type="button" class="nav-btn" data-view="config">
            <span data-i18n="nav.config">引擎配置与接入</span>
          </button>
        </li>
      </ul>

      <div class="sidebar__foot">
        <div class="row-actions">
          <span id="sidebarVersion" class="badge">v--</span>
          <span id="sidebarProtocolBadge" class="badge badge--accent">StreamGenerate</span>
        </div>
        <div id="sidebarAuthNote" class="mono">auth: --</div>
      </div>
    </nav>

    <main id="mainContent" class="main-pane" tabindex="-1">
      <section id="view-overview"></section>
      <section id="view-traffic" hidden></section>
      <section id="view-accounts" hidden></section>
      <section id="view-egress" hidden></section>
      <section id="view-models" hidden></section>
      <section id="view-config" hidden></section>
    </main>
  </div>

  <dialog id="loginDialog" closedby="none" aria-labelledby="loginDialogTitle">
    <div class="dialog__head">
      <h2 id="loginDialogTitle" data-i18n="auth.title">管理控制台认证</h2>
    </div>
    <form id="loginForm">
      <div class="dialog__body">
        <p data-i18n="auth.desc">输入启动参数 --admin-token 或环境变量 ADMIN_TOKEN 配置的管理员令牌。</p>
        <div class="field">
          <label for="loginToken" data-i18n="auth.token_label">管理员令牌 (Admin Token)</label>
          <input type="password" id="loginToken" name="token" autocomplete="current-password" required>
        </div>
        <div id="loginError" class="alert alert--err" role="alert" hidden></div>
      </div>
      <div class="dialog__foot">
        <button type="submit" id="loginSubmitBtn" class="btn btn--primary" data-i18n="auth.submit">解锁控制台</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmDialog" closedby="any" aria-labelledby="confirmDialogTitle">
    <div class="dialog__head">
      <h2 id="confirmDialogTitle" data-i18n="common.confirm">确认</h2>
    </div>
    <div class="dialog__body">
      <p id="confirmDialogBody"></p>
    </div>
    <form method="dialog" class="dialog__foot">
      <button type="submit" id="confirmDialogCancel" class="btn" value="cancel" formnovalidate data-i18n="common.cancel">取消</button>
      <button type="submit" id="confirmDialogOk" class="btn btn--primary" value="confirm" data-i18n="common.confirm">确认</button>
    </form>
  </dialog>

  <dialog id="errorSampleDialog" closedby="any" aria-labelledby="errorSampleTitle">
    <div class="dialog__head">
      <h2 id="errorSampleTitle">Error Sample</h2>
    </div>
    <div class="dialog__body">
      <pre class="code-block" role="region" tabindex="0" aria-labelledby="errorSampleTitle"><code id="errorSampleCode"></code></pre>
    </div>
    <form method="dialog" class="dialog__foot">
      <button type="submit" class="btn" data-i18n="common.close">关闭</button>
    </form>
  </dialog>

  <div id="toastStack" class="toast-stack" aria-live="polite"></div>
</body>
</html>
